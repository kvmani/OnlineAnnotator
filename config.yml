server:
  host: "0.0.0.0"
  port: 5070
  base_path: ""
  cors_origins:
    - "http://localhost:5070"
    - "http://127.0.0.1:5070"
    - "http://localhost:5000"
    - "http://127.0.0.1:5000"

security:
  secret_key: "online-annotator-secure-intranet-secret-key-change-in-production"
  session_expire_days: 7
  otp_expire_seconds: 600
  lock_lease_seconds: 600
  allowed_email_domains: []  # Empty means allow any valid email address format

database:
  url: "sqlite:///data/annotator.sqlite3"

storage:
  data_dir: "data"
  images_dir: "data/images"
  masks_dir: "data/masks"
  exports_dir: "data/exports"
  ledger_file: "data/ledger.json"

email:
  enabled: false
  smtp_host: "127.0.0.1"
  smtp_port: 25
  use_tls: false
  username: ""
  password: ""
  from_address: "annotator-noreply@intranet.local"

default_classes:
  - name: "Hydride"
    color_hex: "#FF0000"
    class_index: 1
    description: "Hydride precipitate platelets and clusters"
  - name: "Matrix"
    color_hex: "#2ECC71"
    class_index: 2
    description: "Zirconium metal matrix phase"
  - name: "Crack / Pore"
    color_hex: "#3498DB"
    class_index: 3
    description: "Cracks, pores, voids, or delaminations"
  - name: "Grain Boundary"
    color_hex: "#F1C40F"
    class_index: 4
    description: "Prior beta or alpha grain boundaries"
