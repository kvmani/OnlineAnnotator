name: ci

# Lean by design. The only deployment target is the air-gapped office Ubuntu server (Python 3.12),
# so CI checks that platform and nothing else: lint and the pytest suite (which also runs the Node
# label-engine tests). The Playwright browser journeys are a local gate before every release
# (AGENTS.md, "Testing"), not a per-push job.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m ruff check src tests
      - run: python -m pytest -q
